name: keepalive

on:
  schedule:
    - cron: "0 0 1 * *"   # 매달 1일
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git commit --allow-empty -m "keepalive"
          git push
